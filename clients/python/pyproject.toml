[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitbarrel"
version = "0.1.0"
description = "Python client for BitBarrel key-value storage"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "BitBarrel"}
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[project.urls]
Homepage = "https://github.com/yourusername/bitbarrel"
Documentation = "https://github.com/yourusername/bitbarrel#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
