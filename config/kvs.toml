# Default KVS Configuration

[server]
address = "0.0.0.0"
port = 8080
max_connections = 10000

[storage]
data_dir = "./data"
max_file_size = "1GB"
max_key_size = "64KB"
max_value_size = "1MB"
sync_every_write = false

[performance]
worker_threads = 4
write_batch_ms = 1
write_batch_count = 100
hint_file_interval = "10MB"

[merge]
enable = true
trigger_threshold = 0.3
max_merge_threads = 1

[logging]
level = "info"
file = "kvs.log"