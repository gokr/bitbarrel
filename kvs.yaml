# KVS Configuration File
# All values have reasonable defaults

server:
  address: "0.0.0.0"
  port: 8080
  max_connections: 10000
  timeout: 30000  # 30 seconds

storage:
  data_dir: "./data"
  max_file_size: 1073741824  # 1GB
  max_key_size: 65536        # 64KB
  max_value_size: 1048576    # 1MB
  sync_mode: "immediate"     # immediate, buffered, batched, time_based
  fsync_interval: 100        # ms

performance:
  worker_threads: 4
  write_buffer_size: 1000
  write_buffer_timeout: 10    # ms
  read_ahead_size: 64         # KB
  cache_size: 256             # MB

merge:
  enabled: true
  trigger_threshold: 0.3      # 30% fragmentation
  max_merge_threads: 1
  merge_interval: 60          # minutes
  min_file_size: 1048576      # 1MB

logging:
  level: "info"               # debug, info, warn, error
  file: "kvs.log"
  max_size: 104857600         # 100MB
  max_backups: 5
  format: "text"              # text or json