# KVS Configuration Example
# This demonstrates the full configuration structure for KVS
# Load this with: import kvs/config; let config = initConfig("examples/kvs_config.yaml")

server:
  address: "127.0.0.1"
  port: 8080
  max_connections: 1000
  timeout: 30000  # ms

storage:
  data_dir: "./examples/data"
  max_file_size: 1073741824  # 1GB
  max_key_size: 65536  # 64KB
  max_value_size: 33554432  # 32MB
  sync_mode: "immediate"  # immediate, buffered, batched, time_based
  fsync_interval: 100

performance:
  worker_threads: 4
  write_buffer_size: 64  # KB
  write_buffer_timeout: 10  # ms
  read_ahead_size: 64  # KB
  cache_size: 256  # MB

merge:
  enabled: true
  trigger_threshold: 0.3  # 30% fragmentation triggers merge
  max_merge_threads: 1
  merge_interval: 60  # minutes
  min_file_size: 1048576  # 1MB

recovery:
  enabled: true
  validate_checksums: true
  skip_corrupt_records: false
  auto_recovery: true

logging:
  level: "info"  # debug, info, warn, error
  file: "bitbarrel.log"
  max_size: 104857600  # 100MB
  max_backups: 5
  format: "text"  # text, json